<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 260 260"
     width="260"
     height="260">

  <defs>
    <linearGradient id="shimmer" x1="-100%" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#f1f1f1"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f1f1"/>

      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        from="-1 0"
        to="1 0"
        dur="1.2s"
        repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect x="1" y="1" width="260" height="260" rx="14" fill="#fff" stroke="#e5e5e5"/>

  <!-- Foto -->
  <rect x="0" y="0"
        width="260"
        height="260"
        rx="12"
        fill="url(#shimmer)"/>

</svg>